[workspace]
resolver = "3"
members = [
    "crates/session",
    "crates/wire",
    "crates/transport",
    "crates/transport-capnp",
    "crates/tor-socks",
    "crates/tor-arti",
    "crates/transport-ohttp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# The PoC mailroom declares a registry dependency on payjoin.
[patch.crates-io]
payjoin = { git = "https://github.com/0xZaddyy/rust-payjoin", rev = "7366c5082f38f31d1c8a10fe27d88e50c3bc6fd6" }

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = "warn"
missing_debug_implementations = "warn"
