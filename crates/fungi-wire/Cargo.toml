[package]
name = "fungi-wire"
description = "Transport-independent message encoding and logical message identity for the Fungi protocol"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
sha2 = "0.10"

[dev-dependencies]
proptest = "1"
hex = "0.4"
fungi-transport = { path = "../fungi-transport" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = "warn"
missing_debug_implementations = "warn"
