[package]
name = "gossip-sim"
description = "Measurement harness for gossip dissemination (experiment only)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
fungi-transport = { path = "../transport" }
fungi-wire = { path = "../wire" }
fungi-session = { path = "../session" }
sha2 = "0.10"
rand = "0.8"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "test-util"] }

[lints]
workspace = true
