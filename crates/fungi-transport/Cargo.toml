[package]
name = "fungi-transport"
description = "P2P datagram channel abstraction for the Fungi protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "fs"] }

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
proptest = "1"

[lints]
workspace = true
