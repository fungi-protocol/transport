[package]
name = "fungi-tor-socks"
description = "External-daemon Tor backend over SOCKS5 and the control port for the fungi P2P datagram channel"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fungi-transport = { path = "../transport" }
# The backend crate also ships the capnp plugin binary
# (src/bin/fungi-tor-socks-plugin.rs), which exposes this backend over the
# capnp plugin protocol on its own stdio.
fungi-transport-capnp = { path = "../transport-capnp" }
# `net`/`io-util`/`fs` for the Tor SOCKS backend itself; `rt`/`io-std` for the
# plugin binary's current-thread runtime + stdio server.
tokio = { version = "1", features = ["net", "io-util", "fs", "rt", "io-std"] }

[dev-dependencies]
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "process",
] }
proptest = "1"

[lints]
workspace = true
