[package]
name = "fungi-transport-arti"
description = "Arti (in-process Tor) backend for the fungi P2P datagram channel"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fungi-transport = { path = "../transport" }
# The backend crate also ships the capnp plugin binary
# (src/bin/fungi-arti-plugin.rs), which bootstraps arti and exposes this
# backend over the capnp plugin protocol on its own stdio.
fungi-transport-capnp = { path = "../transport-capnp" }
# `rt`/`io-std` for the plugin binary's current-thread runtime + stdio server.
tokio = { version = "1", features = ["rt", "io-std"] }
# arti-client auto-installs a rustls crypto provider only when exactly one is
# in the graph; the plugin binary installs one explicitly so bootstrap never
# panics.
rustls = { version = "0.23", features = ["ring"] }
arti-client = { version = "=0.45.0", default-features = false, features = [
    "tokio",
    "rustls",
    "onion-service-client",
    "onion-service-service",
    # experimental-api NOT required for onion-service-client/-service on 0.45.0 (verified Task 1)
] }
# Pinned to match arti-client's own dependency tree (verified via
# `cargo tree -p fungi-transport-arti | grep -E "tor-hsservice|tor-cell"`).
tor-hsservice = "=0.45.0"
tor-cell = "=0.45.0"
# `TorClient<R>` is generic over the runtime and arti-client does not
# re-export `tor_rtcompat`; `IncomingStreamRequest` lives in `tor_proto`,
# not `tor_hsservice`, on this release. Both are needed as direct deps.
tor-rtcompat = { version = "=0.45.0", default-features = false, features = [
    "tokio",
] }
tor-proto = "=0.45.0"
# `RsaIdentity` / `Ed25519Identity` (authority + fallback-cache identity types
# used by `arti_client::config::dir`) are not re-exported through arti-client;
# the private-net descriptor builder needs them directly. Pinned to the version
# already in Cargo.lock via arti-client's own dependency tree.
tor-llcrypto = "=0.45.0"
# `HsId` (the onion-service address type) only implements
# `safelog::DisplayRedacted`, not plain `Display` — this crate needs the
# unredacted form to hand real addresses to peers out of band. Pinned to the
# version already in Cargo.lock via arti-client's own dependency tree.
safelog = "=0.9.1"
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
