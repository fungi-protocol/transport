name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  # Fast crane checks (nextest, clippy, fmt, doc), pinned by flake.lock.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      # TODO: add a nix cache once first-run wall-clock is measured (magic-nix-cache was sunset)
      - run: |
          nix build -L \
            .#checks.x86_64-linux.nextest \
            .#checks.x86_64-linux.clippy \
            .#checks.x86_64-linux.fmt \
            .#checks.x86_64-linux.doc

  # Cross-backend onion VM test: runs alongside the fast checks as a separate
  # job on every PR and push, so integration is validated on each change.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The tor-e2e check boots NixOS VMs, which need KVM. The runner exposes
      # /dev/kvm but the runner user is not in the kvm group; grant world access
      # via a udev rule and re-trigger so the node it applies to picks it up.
      - name: Enable KVM access for the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The arti build plus the VM disk images are large; the stock runner image
      # ships toolchains that crowd the disk. Reclaim space before the build.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix build -L .#checks.x86_64-linux.tor-e2e
